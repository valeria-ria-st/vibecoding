<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonCamp · Аналог freeCodeCamp</title>
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Подсветка кода Prism -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/themes/prism-tomorrow.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ---------- Шапка ---------- */
        .navbar {
            background: #0f131f;
            border-bottom: 1px solid #1e2636;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            background: rgba(15, 19, 31, 0.9);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
        }

        .logo i {
            color: #3776ab;
            background: #1e2636;
            padding: 0.4rem;
            border-radius: 10px;
            font-size: 1.8rem;
        }

        .logo span {
            background: linear-gradient(135deg, #3776ab, #ffd43b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: #1a1f2e;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #2d3748;
        }

        .progress-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: #a0aec0;
        }

        .progress-text strong {
            color: #ffd43b;
            font-size: 1rem;
        }

        .progress-bar-bg {
            width: 180px;
            height: 8px;
            background: #2d3748;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3776ab, #ffd43b);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        /* ---------- Основной layout ---------- */
        .app-container {
            display: flex;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            padding: 1.5rem 2rem;
            gap: 2rem;
        }

        /* ---------- Сайдбар с уроками ---------- */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: #0f131f;
            border-radius: 20px;
            padding: 1.5rem 0.5rem 1.5rem 1rem;
            border: 1px solid #1e2636;
            height: fit-content;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            position: sticky;
            top: 90px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .sidebar h3 {
            color: #a0aec0;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            padding-left: 0.75rem;
        }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .module-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #cbd5e0;
            font-weight: 500;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .module-item i {
            width: 20px;
            font-size: 1rem;
            color: #4a5568;
            transition: color 0.2s;
        }

        .module-item:hover {
            background: #1a1f2e;
            color: white;
        }

        .module-item.active {
            background: #1e2a3a;
            color: white;
            border-left: 3px solid #3776ab;
        }

        .module-item.active i {
            color: #ffd43b;
        }

        .module-item.completed i.fa-check-circle {
            color: #48bb78;
        }

        /* ---------- Основной контент ---------- */
        .main-content {
            flex: 1;
            background: #0f131f;
            border-radius: 24px;
            border: 1px solid #1e2636;
            padding: 2.5rem 2.5rem;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            min-width: 0;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .lesson-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #a0aec0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lesson-badge {
            background: #1e2636;
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffd43b;
            border: 1px solid #2d3748;
        }

        .lesson-description {
            font-size: 1.1rem;
            color: #a0aec0;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1e2636;
        }

        .theory-box {
            background: #0b0f17;
            border-left: 4px solid #3776ab;
            padding: 1.5rem 1.8rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            color: #cbd5e0;
            font-size: 1.05rem;
        }

        .theory-box code {
            background: #1e2636;
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            color: #ffd43b;
        }

        .code-example {
            margin: 1.8rem 0;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #1e2636;
            background: #0b0f17;
        }

        .code-example-header {
            background: #1a1f2e;
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .code-example pre {
            margin: 0 !important;
            border-radius: 0 !important;
            background: #0b0f17 !important;
            padding: 1.2rem !important;
            font-size: 0.95rem;
        }

        .task-container {
            margin-top: 2rem;
            background: #1a1f2e;
            padding: 1.8rem;
            border-radius: 20px;
            border: 1px solid #2d3748;
        }

        .task-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: white;
        }

        .task-title i {
            color: #ffd43b;
        }

        .task-desc {
            color: #a0aec0;
            margin-bottom: 1.5rem;
        }

        .editor-wrapper {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #2d3748;
            background: #0b0f17;
            margin-bottom: 1.5rem;
        }

        .editor-header {
            background: #1e2636;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .editor-header span i {
            margin-right: 0.4rem;
            color: #ffd43b;
        }

        #code-editor {
            width: 100%;
            min-height: 180px;
            background: #0b0f17;
            border: none;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.95rem;
            padding: 1rem 1.2rem;
            resize: vertical;
            outline: none;
            line-height: 1.5;
            tab-size: 4;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: #3776ab;
            color: white;
            box-shadow: 0 4px 12px rgba(55, 118, 171, 0.3);
        }

        .btn-primary:hover {
            background: #2c5f8a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #2d3748;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #3a4558;
        }

        .btn-success {
            background: #276749;
            color: white;
        }

        .btn-success:hover {
            background: #1f4d37;
        }

        .result-box {
            background: #0b0f17;
            border-radius: 14px;
            padding: 1.2rem 1.5rem;
            border: 1px solid #2d3748;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #a0aec0;
            min-height: 80px;
            margin-top: 0.5rem;
        }

        .result-success {
            border-left: 4px solid #48bb78;
            background: #0d1f14;
            color: #9ae6b4;
        }

        .result-error {
            border-left: 4px solid #e53e3e;
            background: #1f0d0d;
            color: #feb2b2;
        }

        .result-info {
            border-left: 4px solid #3776ab;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1e2636;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #2d3748;
            color: #a0aec0;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #1a1f2e;
            color: white;
            border-color: #3776ab;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f131f;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a5568;
        }

        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                padding: 1rem;
            }
            .sidebar {
                width: 100%;
                max-height: 300px;
                position: static;
            }
            .main-content {
                padding: 1.5rem;
            }
            .lesson-title {
                font-size: 1.6rem;
            }
            .navbar {
                padding: 0.8rem 1rem;
            }
            .progress-bar-bg {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <nav class="navbar">
        <div class="logo">
            <i class="fab fa-python"></i>
            <span>PythonCamp</span>
        </div>
        <div class="progress-container">
            <div class="progress-text">Прогресс: <strong id="progress-percent">0%</strong></div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
        </div>
    </nav>

    <!-- Основное приложение -->
    <div class="app-container">
        <!-- Сайдбар -->
        <aside class="sidebar">
            <h3><i class="fas fa-book-open" style="margin-right: 8px;"></i> Модули курса</h3>
            <div class="module-list" id="module-list">
                <!-- Генерируется через JS -->
            </div>
        </aside>

        <!-- Контент урока -->
        <main class="main-content" id="main-content">
            <!-- Динамическое содержимое -->
        </main>
    </div>

    <!-- Скрипты -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/components/prism-python.min.js"></script>
    <script>
        // ==================== ДАННЫЕ КУРСА ====================
        const courseData = [
            {
                id: 'intro',
                title: 'Введение в Python',
                icon: 'fa-flag',
                description: 'Узнайте, что такое Python, почему он популярен и как начать писать код.',
                theory: `
                    <p><strong>Python</strong> — это высокоуровневый язык программирования общего назначения, который отличается простым и читаемым синтаксисом. Он широко используется в веб-разработке, анализе данных, искусственном интеллекте, автоматизации и многих других областях.</p>
                    <p>Python был создан Гвидо ван Россумом и впервые выпущен в 1991 году. Его философия подчеркивает ясность кода и простоту чтения.</p>
                    <p>Основные особенности:</p>
                    <ul style="margin-left: 1.5rem; color: #a0aec0;">
                        <li>Простой и понятный синтаксис</li>
                        <li>Кроссплатформенность</li>
                        <li>Большая стандартная библиотека</li>
                        <li>Динамическая типизация</li>
                        <li>Поддержка множества парадигм программирования</li>
                    </ul>
                `,
                example: `print("Привет, мир!")`,
                task: `Напишите программу, которая выводит на экран фразу "Я изучаю Python!"`,
                initialCode: `# Напишите ваш код ниже\n`,
                solution: `print("Я изучаю Python!")`,
                check: (code) => {
                    const cleaned = code.replace(/\s/g, '').toLowerCase();
                    return cleaned.includes('print("яизучаюpython!")') || cleaned.includes("print('яизучаюpython!')");
                },
                hint: 'Используйте функцию print() с текстом в кавычках.'
            },
            {
                id: 'variables',
                title: 'Переменные и типы данных',
                icon: 'fa-cube',
                description: 'Изучите, как хранить данные в переменных и какие типы данных бывают в Python.',
                theory: `
                    <p><strong>Переменная</strong> — это именованная область памяти, в которой хранятся данные. В Python не нужно объявлять тип переменной заранее — он определяется автоматически.</p>
                    <p>Основные типы данных:</p>
                    <ul style="margin-left: 1.5rem; color: #a0aec0;">
                        <li><code>int</code> — целые числа (например, 5, -10)</li>
                        <li><code>float</code> — числа с плавающей точкой (3.14, 2.0)</li>
                        <li><code>str</code> — строки ("Hello", 'Python')</li>
                        <li><code>bool</code> — логический тип (True, False)</li>
                    </ul>
                    <p>Пример присваивания: <code>name = "Анна"</code>, <code>age = 25</code>.</p>
                `,
                example: `name = "Алексей"\nage = 30\nprint("Меня зовут", name, "и мне", age, "лет")`,
                task: `Создайте переменную <code>city</code> со значением "Москва" и переменную <code>population</code> со значением 12.5 (миллионов). Выведите их на экран через запятую.`,
                initialCode: `# Создайте переменные city и population\n\n# Выведите их на экран\n`,
                solution: `city = "Москва"\npopulation = 12.5\nprint(city, population)`,
                check: (code) => {
                    const cleaned = code.replace(/\s/g, '');
                    return cleaned.includes('city="москва"') && cleaned.includes('population=12.5') && cleaned.includes('print(city,population)');
                },
                hint: 'Не забывайте про кавычки для строк. Для вывода нескольких значений используйте запятую в print().'
            },
            {
                id: 'conditionals',
                title: 'Условные операторы',
                icon: 'fa-code-branch',
                description: 'Научитесь управлять потоком программы с помощью if, elif и else.',
                theory: `
                    <p><strong>Условные операторы</strong> позволяют выполнять разный код в зависимости от условий.</p>
                    <p>Синтаксис:</p>
                    <pre style="background: #1e2636; padding: 1rem; border-radius: 10px; color: #ffd43b;"><code>if условие:\n    # блок кода\nelif другое_условие:\n    # блок кода\nelse:\n    # блок кода</code></pre>
                    <p>В Python важны отступы (обычно 4 пробела) для обозначения блоков кода.</p>
                    <p>Операторы сравнения: <code>==</code>, <code>!=</code>, <code>></code>, <code><</code>, <code>>=</code>, <code><=</code>.</p>
                `,
                example: `x = 10\nif x > 5:\n    print("x больше 5")\nelse:\n    print("x меньше или равен 5")`,
                task: `Напишите программу, которая проверяет переменную <code>temperature</code> (задайте её равной 25). Если температура больше 20, выведите "Тепло", иначе — "Холодно".`,
                initialCode: `temperature = 25\n# Ваш код\n`,
                solution: `temperature = 25\nif temperature > 20:\n    print("Тепло")\nelse:\n    print("Холодно")`,
                check: (code) => {
                    const cleaned = code.replace(/\s/g, '');
                    return (cleaned.includes('iftemperature>20:') || cleaned.includes('if20<temperature:')) && cleaned.includes('print("тепло")') && cleaned.includes('else:') && (cleaned.includes('print("холодно")'));
                },
                hint: 'Не забудьте про двоеточие после условия и отступы.'
            },
            {
                id: 'loops',
                title: 'Циклы for и while',
                icon: 'fa-redo-alt',
                description: 'Изучите циклы для повторяющихся действий.',
                theory: `
                    <p><strong>Циклы</strong> позволяют выполнять блок кода несколько раз.</p>
                    <p><strong>Цикл for</strong> используется для перебора последовательностей (списки, строки, range).</p>
                    <pre style="background: #1e2636; padding: 1rem; border-radius: 10px; color: #ffd43b;"><code>for i in range(5):\n    print(i)</code></pre>
                    <p><strong>Цикл while</strong> выполняется, пока условие истинно.</p>
                    <pre style="background: #1e2636; padding: 1rem; border-radius: 10px; color: #ffd43b;"><code>count = 0\nwhile count < 5:\n    print(count)\n    count += 1</code></pre>
                `,
                example: `for i in range(3):\n    print("Итерация", i)`,
                task: `Используя цикл <code>for</code>, выведите числа от 1 до 5 включительно.`,
                initialCode: `# Напишите цикл\n`,
                solution: `for i in range(1, 6):\n    print(i)`,
                check: (code) => {
                    const cleaned = code.replace(/\s/g, '');
                    return cleaned.includes('foriinrange(1,6):') && cleaned.includes('print(i)');
                },
                hint: 'range(1, 6) сгенерирует числа 1, 2, 3, 4, 5.'
            },
            {
                id: 'functions',
                title: 'Функции',
                icon: 'fa-code',
                description: 'Создавайте собственные функции для повторного использования кода.',
                theory: `
                    <p><strong>Функция</strong> — это блок кода, который можно вызывать по имени. Функции помогают избежать дублирования кода.</p>
                    <p>Синтаксис определения функции:</p>
                    <pre style="background: #1e2636; padding: 1rem; border-radius: 10px; color: #ffd43b;"><code>def имя_функции(параметры):\n    # тело функции\n    return результат</code></pre>
                    <p>Функция может возвращать значение с помощью <code>return</code>. Если return отсутствует, функция возвращает <code>None</code>.</p>
                `,
                example: `def greet(name):\n    return "Привет, " + name + "!"\n\nprint(greet("Мир"))`,
                task: `Создайте функцию <code>square(x)</code>, которая возвращает квадрат числа x. Вызовите её с аргументом 7 и выведите результат.`,
                initialCode: `# Определите функцию square\n\n# Вызовите и выведите результат\n`,
                solution: `def square(x):\n    return x * x\n\nprint(square(7))`,
                check: (code) => {
                    const cleaned = code.replace(/\s/g, '');
                    return cleaned.includes('defsquare(x):') && (cleaned.includes('returnx*x') || cleaned.includes('returnx**2')) && cleaned.includes('print(square(7))');
                },
                hint: 'Квадрат числа — это x * x или x ** 2.'
            },
            {
                id: 'lists',
                title: 'Списки',
                icon: 'fa-list',
                description: 'Работайте с коллекциями данных — списками.',
                theory: `
                    <p><strong>Список (list)</strong> — это упорядоченная изменяемая коллекция элементов. Списки заключаются в квадратные скобки <code>[ ]</code>.</p>
                    <p>Пример: <code>fruits = ["яблоко", "банан", "вишня"]</code></p>
                    <p>Основные операции:</p>
                    <ul style="margin-left: 1.5rem; color: #a0aec0;">
                        <li>Доступ по индексу: <code>fruits[0]</code> → "яблоко"</li>
                        <li>Добавление: <code>fruits.append("апельсин")</code></li>
                        <li>Длина: <code>len(fruits)</code></li>
                        <li>Срезы: <code>fruits[1:3]</code></li>
                    </ul>
                `,
                example: `numbers = [1, 2, 3]\nnumbers.append(4)\nprint(numbers)  # [1, 2, 3, 4]`,
                task: `Создайте список <code>colors</code> с элементами "красный", "зелёный", "синий". Добавьте в конец "жёлтый" и выведите список.`,
                initialCode: `# Создайте список и добавьте элемент\n`,
                solution: `colors = ["красный", "зелёный", "синий"]\ncolors.append("жёлтый")\nprint(colors)`,
                check: (code) => {
                    const cleaned = code.replace(/\s/g, '');
                    return cleaned.includes('colors=[') && cleaned.includes('"красный"') && cleaned.includes('"зелёный"') && cleaned.includes('"синий"') && cleaned.includes('.append("жёлтый")') && cleaned.includes('print(colors)');
                },
                hint: 'Используйте метод append() для добавления элемента в конец списка.'
            }
        ];

        // ==================== СОСТОЯНИЕ ====================
        let currentLessonIndex = 0;
        const totalLessons = courseData.length;
        // Прогресс: массив boolean для каждого урока (пройден ли)
        let completedLessons = new Array(totalLessons).fill(false);

        // ==================== DOM ЭЛЕМЕНТЫ ====================
        const moduleListEl = document.getElementById('module-list');
        const mainContentEl = document.getElementById('main-content');
        const progressPercentEl = document.getElementById('progress-percent');
        const progressFillEl = document.getElementById('progress-fill');

        // ==================== ФУНКЦИИ ====================

        // Обновление прогресса
        function updateProgress() {
            const completedCount = completedLessons.filter(Boolean).length;
            const percent = Math.round((completedCount / totalLessons) * 100);
            progressPercentEl.textContent = percent + '%';
            progressFillEl.style.width = percent + '%';
        }

        // Отрисовка сайдбара
        function renderSidebar() {
            moduleListEl.innerHTML = '';
            courseData.forEach((lesson, idx) => {
                const isActive = idx === currentLessonIndex;
                const isCompleted = completedLessons[idx];
                const item = document.createElement('div');
                item.className = `module-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                item.dataset.index = idx;

                let iconHtml = `<i class="fas ${lesson.icon}"></i>`;
                if (isCompleted) {
                    iconHtml = `<i class="fas fa-check-circle" style="color: #48bb78;"></i>`;
                }

                item.innerHTML = `
                    ${iconHtml}
                    <span>${lesson.title}</span>
                `;
                item.addEventListener('click', () => {
                    currentLessonIndex = idx;
                    renderSidebar();
                    renderLesson();
                });
                moduleListEl.appendChild(item);
            });
        }

        // Отрисовка основного контента урока
        function renderLesson() {
            const lesson = courseData[currentLessonIndex];
            const isCompleted = completedLessons[currentLessonIndex];

            // Формируем HTML
            let html = `
                <div class="lesson-header">
                    <h1 class="lesson-title">${lesson.title}</h1>
                    <span class="lesson-badge">${isCompleted ? '✅ Пройден' : '📘 Урок ' + (currentLessonIndex+1) + ' из ' + totalLessons}</span>
                </div>
                <p class="lesson-description">${lesson.description}</p>
                
                <div class="theory-box">
                    ${lesson.theory}
                </div>

                <div class="code-example">
                    <div class="code-example-header">
                        <i class="fas fa-code"></i> Пример кода
                    </div>
                    <pre><code class="language-python">${escapeHtml(lesson.example)}</code></pre>
                </div>

                <div class="task-container">
                    <div class="task-title">
                        <i class="fas fa-tasks"></i> Практическое задание
                    </div>
                    <div class="task-desc">
                        ${lesson.task}
                    </div>

                    <div class="editor-wrapper">
                        <div class="editor-header">
                            <span><i class="fas fa-python"></i> Редактор Python</span>
                            <span style="font-size: 0.8rem; color: #4a5568;">Введите код</span>
                        </div>
                        <textarea id="code-editor" spellcheck="false">${lesson.initialCode || ''}</textarea>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" id="check-btn"><i class="fas fa-play"></i> Проверить</button>
                        <button class="btn btn-secondary" id="hint-btn"><i class="fas fa-lightbulb"></i> Подсказка</button>
                        <button class="btn btn-success" id="complete-btn" ${isCompleted ? 'disabled' : ''}><i class="fas fa-check-circle"></i> ${isCompleted ? 'Уже пройден' : 'Завершить урок'}</button>
                    </div>

                    <div class="result-box" id="result-box">
                        <i class="fas fa-info-circle"></i> Нажмите "Проверить", чтобы протестировать код.
                    </div>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn" id="prev-btn" ${currentLessonIndex === 0 ? 'disabled' : ''}>
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button class="nav-btn" id="next-btn" ${currentLessonIndex === totalLessons - 1 ? 'disabled' : ''}>
                        Вперёд <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            `;

            mainContentEl.innerHTML = html;

            // Подсветка кода
            if (window.Prism) {
                Prism.highlightAll();
            }

            // Навешиваем обработчики
            const codeEditor = document.getElementById('code-editor');
            const checkBtn = document.getElementById('check-btn');
            const hintBtn = document.getElementById('hint-btn');
            const completeBtn = document.getElementById('complete-btn');
            const resultBox = document.getElementById('result-box');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            // Проверка кода
            checkBtn.addEventListener('click', () => {
                const code = codeEditor.value;
                const lessonData = courseData[currentLessonIndex];
                const isCorrect = lessonData.check(code);

                if (isCorrect) {
                    resultBox.className = 'result-box result-success';
                    resultBox.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Верно! Код работает корректно.';
                } else {
                    resultBox.className = 'result-box result-error';
                    resultBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> ❌ Ошибка. Попробуйте ещё раз или посмотрите подсказку.';
                }
            });

            // Подсказка
            hintBtn.addEventListener('click', () => {
                const lessonData = courseData[currentLessonIndex];
                resultBox.className = 'result-box result-info';
                resultBox.innerHTML = `<i class="fas fa-lightbulb"></i> 💡 ${lessonData.hint}`;
            });

            // Завершить урок
            completeBtn.addEventListener('click', () => {
                if (completedLessons[currentLessonIndex]) return;
                // Проверим решение автоматически
                const code = codeEditor.value;
                const lessonData = courseData[currentLessonIndex];
                if (lessonData.check(code)) {
                    completedLessons[currentLessonIndex] = true;
                    updateProgress();
                    renderSidebar();
                    renderLesson(); // перерисовка
                } else {
                    resultBox.className = 'result-box result-error';
                    resultBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> ❌ Нельзя завершить урок: решение неверно. Проверьте код.';
                }
            });

            // Навигация
            prevBtn.addEventListener('click', () => {
                if (currentLessonIndex > 0) {
                    currentLessonIndex--;
                    renderSidebar();
                    renderLesson();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentLessonIndex < totalLessons - 1) {
                    currentLessonIndex++;
                    renderSidebar();
                    renderLesson();
                }
            });
        }

        // Вспомогательная функция экранирования HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Инициализация
        function init() {
            updateProgress();
            renderSidebar();
            renderLesson();
        }

        init();
    </script>
</body>
</html>
